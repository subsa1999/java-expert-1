<svg xmlns="http://www.w3.org/2000/svg" width="820" height="350" viewBox="0 0 820 350"><rect width="820" height="350" rx="14" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#172b4d"><text x="410" y="35" font-size="23" font-weight="bold" text-anchor="middle">Wait-for graph cycle</text><rect x="110" y="110" width="200" height="70" rx="10" fill="#dbeafe" stroke="#64748b"/><rect x="510" y="110" width="200" height="70" rx="10" fill="#fef3c7" stroke="#64748b"/><text x="210" y="150" text-anchor="middle">T1 owns A</text><text x="610" y="150" text-anchor="middle">T2 owns B</text><path d="M310 125 H510 l-10 -6 m10 6 l-10 6 M510 165 H310 l10 -6 m-10 6 l10 6" stroke="#b91c1c" stroke-width="2" fill="none"/><text x="410" y="110" text-anchor="middle">waits for B</text><text x="410" y="192" text-anchor="middle">waits for A</text><text x="410" y="330" text-anchor="middle" font-size="14">A cycle means neither transaction can progress without intervention.</text></g></svg>