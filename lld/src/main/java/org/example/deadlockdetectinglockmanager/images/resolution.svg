<svg xmlns="http://www.w3.org/2000/svg" width="820" height="350" viewBox="0 0 820 350"><rect width="820" height="350" rx="14" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#172b4d"><text x="410" y="35" font-size="23" font-weight="bold" text-anchor="middle">Deadlock resolution</text><rect x="54" y="60" width="348" height="45" rx="7" fill="#dbeafe" stroke="#64748b"/><text x="228" y="88" text-anchor="middle" font-size="14">T1 owns A</text><rect x="418" y="60" width="348" height="45" rx="7" fill="#dbeafe" stroke="#64748b"/><text x="592" y="88" text-anchor="middle" font-size="14">T2 owns B</text><path d="M410 105 v20 l-5 -6 m5 6 l5 -6" fill="none" stroke="#64748b" stroke-width="2"/><rect x="160" y="130" width="500" height="45" rx="7" fill="#fef3c7" stroke="#64748b"/><text x="410" y="158" text-anchor="middle" font-size="14">Reject T2 request for A</text><path d="M410 175 v20 l-5 -6 m5 6 l5 -6" fill="none" stroke="#64748b" stroke-width="2"/><rect x="54" y="200" width="348" height="45" rx="7" fill="#dcfce7" stroke="#64748b"/><text x="228" y="228" text-anchor="middle" font-size="14">T2 aborts and releases B</text><rect x="418" y="200" width="348" height="45" rx="7" fill="#dcfce7" stroke="#64748b"/><text x="592" y="228" text-anchor="middle" font-size="14">T1 can acquire B</text><text x="410" y="330" text-anchor="middle" font-size="14">Detection does not automatically roll back business changes.</text></g></svg>