<svg xmlns="http://www.w3.org/2000/svg" width="820" height="320" viewBox="0 0 820 320"><rect width="820" height="320" rx="14" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#172b4d"><text x="410" y="35" font-size="23" font-weight="bold" text-anchor="middle">One-shot countdown</text><rect x="52" y="60" width="228" height="45" rx="7" fill="#dbeafe" stroke="#64748b"/><text x="166" y="88" font-size="14" text-anchor="middle">Initial: 3</text><rect x="296" y="60" width="228" height="45" rx="7" fill="#dbeafe" stroke="#64748b"/><text x="410" y="88" font-size="14" text-anchor="middle">countDown: 2</text><rect x="540" y="60" width="228" height="45" rx="7" fill="#dbeafe" stroke="#64748b"/><text x="654" y="88" font-size="14" text-anchor="middle">countDown: 1</text><path d="M410 105 v20 l-5 -6 m5 6 l5 -6" fill="none" stroke="#64748b" stroke-width="2"/><rect x="250" y="130" width="320" height="45" rx="7" fill="#fef3c7" stroke="#64748b"/><text x="410" y="158" font-size="14" text-anchor="middle">Final countDown: 0</text><path d="M410 175 v20 l-5 -6 m5 6 l5 -6" fill="none" stroke="#64748b" stroke-width="2"/><rect x="82" y="200" width="320" height="45" rx="7" fill="#dcfce7" stroke="#64748b"/><text x="242" y="228" font-size="14" text-anchor="middle">Waiter A proceeds</text><rect x="418" y="200" width="320" height="45" rx="7" fill="#dcfce7" stroke="#64748b"/><text x="578" y="228" font-size="14" text-anchor="middle">Waiter B proceeds</text><text x="410" y="300" text-anchor="middle" font-size="14">Only the transition to zero opens the gate.</text></g></svg>