<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300"><rect width="800" height="300" rx="12" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#172b4d"><text x="400" y="35" text-anchor="middle" font-size="23" font-weight="bold">Shared reads vs exclusive writes</text><rect x="35" y="65" width="220" height="48" rx="8" fill="#dcfce7" stroke="#64748b"/><text x="145" y="94" text-anchor="middle" font-size="15">Reader R1: active</text><rect x="290" y="65" width="220" height="48" rx="8" fill="#dcfce7" stroke="#64748b"/><text x="400" y="94" text-anchor="middle" font-size="15">Reader R2: active</text><rect x="545" y="65" width="220" height="48" rx="8" fill="#fef3c7" stroke="#64748b"/><text x="655" y="94" text-anchor="middle" font-size="15">Writer W1: waiting</text><text x="400" y="145" text-anchor="middle" font-size="15">Once all readers release their locks:</text><rect x="35" y="170" width="220" height="48" rx="8" fill="#fef3c7" stroke="#64748b"/><text x="145" y="199" text-anchor="middle" font-size="15">Reader R3: waiting</text><rect x="290" y="170" width="220" height="48" rx="8" fill="#dcfce7" stroke="#64748b"/><text x="400" y="199" text-anchor="middle" font-size="15">Writer W1: active</text><rect x="545" y="170" width="220" height="48" rx="8" fill="#fef3c7" stroke="#64748b"/><text x="655" y="199" text-anchor="middle" font-size="15">Writer W2: waiting</text><text x="400" y="270" text-anchor="middle" font-size="15">A writer excludes every other thread from reading or writing.</text></g></svg>