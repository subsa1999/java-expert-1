<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300"><rect width="800" height="300" rx="12" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#172b4d"><text x="400" y="35" text-anchor="middle" font-size="23" font-weight="bold">Safe write-to-read lock downgrading</text><rect x="35" y="70" width="225" height="48" rx="8" fill="#dbeafe" stroke="#64748b"/><text x="147.5" y="99" text-anchor="middle" font-size="15">T1 holds WRITE</text><rect x="290" y="70" width="220" height="48" rx="8" fill="#dbeafe" stroke="#64748b"/><text x="400" y="99" text-anchor="middle" font-size="15">T1 acquires READ</text><rect x="540" y="70" width="225" height="48" rx="8" fill="#dcfce7" stroke="#64748b"/><text x="652.5" y="99" text-anchor="middle" font-size="15">T1 releases WRITE</text><path d="M260 94 H290 M510 94 H540" stroke="#334155" stroke-width="2"/><path d="M283 88 L290 94 L283 100 M533 88 L540 94 L533 100" stroke="#334155" stroke-width="2" fill="none"/><text x="400" y="150" text-anchor="middle" font-size="15">T1 continuously holds at least one lock throughout.</text><rect x="165" y="177" width="220" height="48" rx="8" fill="#dcfce7" stroke="#64748b"/><text x="275" y="206" text-anchor="middle" font-size="15">T1 holds READ</text><rect x="415" y="177" width="220" height="48" rx="8" fill="#dcfce7" stroke="#64748b"/><text x="525" y="206" text-anchor="middle" font-size="15">Other readers eligible</text><text x="400" y="270" text-anchor="middle" font-size="15">Other writers remain blocked until every read hold is released.</text></g></svg>