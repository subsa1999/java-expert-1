<svg xmlns="http://www.w3.org/2000/svg" width="820" height="350" viewBox="0 0 820 350"><rect width="820" height="350" rx="14" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#172b4d"><text x="410" y="35" font-size="23" font-weight="bold" text-anchor="middle">Thread-starvation deadlock</text><rect x="54" y="60" width="348" height="45" rx="7" fill="#dbeafe" stroke="#64748b"/><text x="228" y="88" text-anchor="middle" font-size="14">Worker 1 waits for child A</text><rect x="418" y="60" width="348" height="45" rx="7" fill="#dbeafe" stroke="#64748b"/><text x="592" y="88" text-anchor="middle" font-size="14">Worker 2 waits for child B</text><path d="M410 105 v20 l-5 -6 m5 6 l5 -6" fill="none" stroke="#64748b" stroke-width="2"/><rect x="54" y="130" width="348" height="45" rx="7" fill="#fef3c7" stroke="#64748b"/><text x="228" y="158" text-anchor="middle" font-size="14">Child A queued</text><rect x="418" y="130" width="348" height="45" rx="7" fill="#fef3c7" stroke="#64748b"/><text x="592" y="158" text-anchor="middle" font-size="14">Child B queued</text><path d="M410 175 v20 l-5 -6 m5 6 l5 -6" fill="none" stroke="#64748b" stroke-width="2"/><rect x="160" y="200" width="500" height="45" rx="7" fill="#dcfce7" stroke="#64748b"/><text x="410" y="228" text-anchor="middle" font-size="14">No free worker to execute children</text><text x="410" y="330" text-anchor="middle" font-size="14">Avoid blocking every fixed-pool worker on queued descendants.</text></g></svg>