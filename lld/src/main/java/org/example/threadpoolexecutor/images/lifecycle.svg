<svg xmlns="http://www.w3.org/2000/svg" width="820" height="320" viewBox="0 0 820 320"><rect width="820" height="320" rx="14" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#172b4d"><text x="410" y="35" font-size="23" font-weight="bold" text-anchor="middle">Executor lifecycle</text><rect x="250" y="60" width="320" height="45" rx="7" fill="#dbeafe" stroke="#64748b"/><text x="410" y="88" font-size="14" text-anchor="middle">RUNNING: accepts tasks</text><path d="M410 105 v20 l-5 -6 m5 6 l5 -6" fill="none" stroke="#64748b" stroke-width="2"/><rect x="82" y="130" width="320" height="45" rx="7" fill="#fef3c7" stroke="#64748b"/><text x="242" y="158" font-size="14" text-anchor="middle">SHUTDOWN: drains</text><rect x="418" y="130" width="320" height="45" rx="7" fill="#fef3c7" stroke="#64748b"/><text x="578" y="158" font-size="14" text-anchor="middle">STOP: interrupts</text><path d="M410 175 v20 l-5 -6 m5 6 l5 -6" fill="none" stroke="#64748b" stroke-width="2"/><rect x="250" y="200" width="320" height="45" rx="7" fill="#dcfce7" stroke="#64748b"/><text x="410" y="228" font-size="14" text-anchor="middle">TERMINATED: all workers exited</text><text x="410" y="300" text-anchor="middle" font-size="14">shutdownNow may also transition SHUTDOWN to STOP.</text></g></svg>