<svg xmlns="http://www.w3.org/2000/svg" width="820" height="350" viewBox="0 0 820 350"><rect width="820" height="350" rx="14" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#172b4d"><text x="410" y="35" font-size="23" font-weight="bold" text-anchor="middle">A complete molecule</text><rect x="52" y="60" width="228" height="45" rx="7" fill="#dbeafe" stroke="#64748b"/><text x="166" y="88" text-anchor="middle" font-size="14">Hydrogen H1</text><rect x="296" y="60" width="228" height="45" rx="7" fill="#dbeafe" stroke="#64748b"/><text x="410" y="88" text-anchor="middle" font-size="14">Hydrogen H2</text><rect x="540" y="60" width="228" height="45" rx="7" fill="#dbeafe" stroke="#64748b"/><text x="654" y="88" text-anchor="middle" font-size="14">Oxygen O1</text><path d="M410 105 v20 l-5 -6 m5 6 l5 -6" fill="none" stroke="#64748b" stroke-width="2"/><rect x="160" y="130" width="500" height="45" rx="7" fill="#fef3c7" stroke="#64748b"/><text x="410" y="158" text-anchor="middle" font-size="14">Selected generation: 2H + 1O</text><path d="M410 175 v20 l-5 -6 m5 6 l5 -6" fill="none" stroke="#64748b" stroke-width="2"/><rect x="160" y="200" width="500" height="45" rx="7" fill="#dcfce7" stroke="#64748b"/><text x="410" y="228" text-anchor="middle" font-size="14">All three callbacks finish</text><text x="410" y="330" text-anchor="middle" font-size="14">Only then may the next molecule begin.</text></g></svg>